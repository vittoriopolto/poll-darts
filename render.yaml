services:
  - type: web
    name: pdc-poll-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TIMEZONE
        value: Europe/Rome
      - key: CLOSE_MINUTES_BEFORE
        value: "5"
      - key: COVER_TITLE
        value: PDC180 POLL
      - key: MUTE_MODE
        value: invio
